name: SOT V4 external validation

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["sot-v4-external-validation"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Prepare V4 runtime source
        run: python validation/sot_v4/prepare_v4.py

      - name: Initialize immutable staging area
        run: |
          rm -rf "$RUNNER_TEMP/sot-v4-staging"
          mkdir -p "$RUNNER_TEMP/sot-v4-staging"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned TGB integration
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 pandas==2.2.3 scikit-learn==1.5.2
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.1
          python -m pip install py-tgb==2.2.0
          python -m pip check
          python -m pip freeze | sort > validation/sot_v4/python-freeze.txt
          cp validation/sot_v4/python-freeze.txt "$RUNNER_TEMP/sot-v4-staging/"

      - name: Run local algorithm self-test
        run: python validation/sot_v4/tgb_validation.py --self-test

      - name: Run official TGB validation
        env:
          TGB_VERBOSE: "True"
        run: |
          set -o pipefail
          mkdir -p validation/sot_v4/out
          python validation/sot_v4/tgb_validation.py \
            --out-dir validation/sot_v4/out \
            --eval-queries 1200 \
            --cover-witnesses 128 \
            2>&1 | tee validation/sot_v4/out/tgb-run.log
          cp validation/sot_v4/out/tgb_results.json "$RUNNER_TEMP/sot-v4-staging/"
          cp validation/sot_v4/out/tgb-run.log "$RUNNER_TEMP/sot-v4-staging/"
          sha256sum validation/sot_v4/out/tgbl_uci_edges.tsv > "$RUNNER_TEMP/sot-v4-staging/tgbl_uci_edges.tsv.sha256"
          gzip -9 -c validation/sot_v4/out/tgbl_uci_edges.tsv > "$RUNNER_TEMP/sot-v4-staging/tgbl_uci_edges.tsv.gz"

      - uses: dtolnay/rust-toolchain@1.86.0

      - name: Build and run Differential Dataflow 0.24.0
        run: |
          set -o pipefail
          cargo run --release \
            --manifest-path validation/sot_v4/differential/Cargo.toml -- \
            validation/sot_v4/out/tgbl_uci_edges.tsv \
            validation/sot_v4/out/differential_results.json \
            30000 500 604800 \
            2>&1 | tee validation/sot_v4/out/differential-run.log
          rustc --version > validation/sot_v4/out/rust-toolchain.txt
          cargo --version >> validation/sot_v4/out/rust-toolchain.txt
          cp validation/sot_v4/out/differential_results.json "$RUNNER_TEMP/sot-v4-staging/"
          cp validation/sot_v4/out/differential-run.log validation/sot_v4/out/rust-toolchain.txt "$RUNNER_TEMP/sot-v4-staging/"

      - name: Cross-system acceptance gate
        run: |
          set -o pipefail
          python validation/sot_v4/verify_v4.py validation/sot_v4/out 2>&1 | tee validation/sot_v4/out/verify.log
          cp validation/sot_v4/out/v4_validation.json validation/sot_v4/out/verify.log "$RUNNER_TEMP/sot-v4-staging/"

      - name: Collect content-addressed evidence
        if: always()
        run: |
          rm -rf validation/sot_v4/evidence
          mkdir -p validation/sot_v4/evidence/source validation/sot_v4/evidence/results
          cp validation/sot_v4/tgb_validation.py validation/sot_v4/verify_v4.py validation/sot_v4/prepare_v4.py validation/sot_v4/README.md validation/sot_v4/evidence/source/
          cp validation/sot_v4/differential/Cargo.toml validation/sot_v4/differential/Cargo.lock validation/sot_v4/evidence/source/ 2>/dev/null || true
          mkdir -p validation/sot_v4/evidence/source/differential-src
          cp validation/sot_v4/differential/src/main.rs validation/sot_v4/evidence/source/differential-src/
          cp "$RUNNER_TEMP/sot-v4-staging"/* validation/sot_v4/evidence/results/ 2>/dev/null || true
          cp validation/sot_v4/out/*.log validation/sot_v4/evidence/results/ 2>/dev/null || true
          ls -lah validation/sot_v4/out > validation/sot_v4/evidence/results/out-listing.txt 2>&1 || true
          ls -lah "$RUNNER_TEMP/sot-v4-staging" > validation/sot_v4/evidence/results/staging-listing.txt 2>&1 || true
          git rev-parse HEAD > validation/sot_v4/evidence/commit.txt
          find validation/sot_v4/evidence -type f ! -name MANIFEST.sha256 -print0 \
            | sort -z | xargs -0 sha256sum > validation/sot_v4/evidence/MANIFEST.sha256

      - name: Upload V4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sot-v4-external-validation-evidence
          path: validation/sot_v4/evidence
          if-no-files-found: error
